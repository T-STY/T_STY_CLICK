plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.t_sty.mx.click"
    compileSdk = flutter.compileSdkVersion

    // CLEANUP: Removed the duplicate ndkVersion.
    // We rely on Flutter to manage this. Only uncomment the specific version
    // below if you have a specific build failure requiring NDK 27.
    ndkVersion = flutter.ndkVersion
    // ndkVersion "27.3.13750724"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.t_sty.mx.click"

        // CLEANUP: Consolidated minSdk and removed redundant lines
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // SAFETY: We check if the keys exist before trying to assign them
            // to prevent "Key not found" errors on CI/CD or other machines.
            if (keystoreProperties['storeFile']) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // SAFETY: Only apply the signing config if the storeFile was actually found above.
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }

            // Optimization settings
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}