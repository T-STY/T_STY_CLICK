name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # also lets you trigger the manual E2E job below

env:
  FLUTTER_VERSION: "3.38.4"
  FIREBASE_PROJECT: arthemis-f2966

jobs:
  # ── Layer 1: static analysis (whole codebase) ─────────────────────────
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter analyze (fails on errors/warnings; infos allowed)
        run: flutter analyze
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloud Functions syntax check
        run: node --check functions/index.js

  # ── Layers 2 + 3: rules + Cloud Functions tests on the emulator ───────
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4 # Firestore emulator runs on the JVM
        with:
          distribution: temurin
          java-version: "21"
      - name: Install firebase-tools
        run: npm install -g firebase-tools
      - name: Install test deps
        run: |
          npm install --prefix firestore-tests
          npm install --prefix functions
      - name: Rules + Functions suites (single emulator boot)
        run: |
          firebase emulators:exec --only firestore --project "$FIREBASE_PROJECT" "\
            node firestore-tests/node_modules/mocha/bin/mocha.js --timeout 15000 firestore-tests/test/rules.test.js && \
            node functions/node_modules/mocha/bin/mocha.js --timeout 20000 functions/test/functions.test.js"

  # ── Layer 4: end-to-end smoke on an Android emulator ──────────────────
  # Manual (workflow_dispatch) on purpose: it needs android/app/google-services.json
  # present in the runner (not committed here) and boots a heavy Android AVD, so
  # it isn't suitable as a required check on every push. Run it on demand from
  # the Actions tab, or wire google-services.json in as a secret to enable on push.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: npm install -g firebase-tools
      - run: flutter pub get
      # Provide google-services.json from a secret so the Android app builds.
      # (No-op if the secret isn't set — the build will then fail with a clear
      # message about the missing config.)
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Start emulators + seed
        run: |
          firebase emulators:start --only firestore,auth,functions --project "$FIREBASE_PROJECT" &
          npx wait-on tcp:8080 tcp:9099 tcp:5001
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 GCLOUD_PROJECT="$FIREBASE_PROJECT" node functions/seed-emulator.js
      - name: Run smoke E2E on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: flutter test integration_test/smoke_test.dart --dart-define=USE_FIREBASE_EMULATOR=true
